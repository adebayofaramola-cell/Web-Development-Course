<!DOCTYPE html>
<html>
    <body>
        <p>A fuction can access a variable defined inside the fuction:</p>
        <button type="button" onclick="myFunction()">Click Me!!!</button>
        <P id="demo"></P>
        <P id="demo1"></P>
        <script>
            var b= 6;
            function myFunction(){
                var a= 7;
                document.getElementById(demo).innerHTML = b*a;
            }
            document.getElementById(demo).innerHTML = a;
            document.getElementById(demo1).innerHTML = b;
        </script>
    </body>
</html>
