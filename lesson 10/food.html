<!DOCTYPE html>
<html>
    <head>
        <title>My Food Menu</title>
        <style>
            body {
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                background: #d41a52;
                padding: 30px;
                text-align: center;
            }

            h1 {color: #ffd256;}

            /* Sibling Selector - styles the paragragh after h1 */
            h1 + p{
                background: #f5f5f5;
                padding: 10px 20px;
                border-radius: 8px;
                color: rgb(49, 146, 231);
                display: inline-block;
            }

            ul {padding: 0;margin-top: 20px;}

            ul > li{
                list-style: none;
                font-size: 18px;
                font-weight:100;
                color: rgb(65, 187, 240);
                padding: 10px 10px;
                margin: 6px auto;
                width: 260px;
                background: #f5f4f1;
                border-radius: 8px;
            }

            ul li:nth-child(3) {
      background: #ffe082;
      color: #e65c00;
    }

    .desc {
      color: #555;
      margin-top: 20px;
      font-size: 15px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* first-letter - makes the first letter big and bold */
    .desc::first-letter {
      font-size: 220%;
      color: #e65c00;
      font-weight: bold;
    }

    .links { margin-top: 25px; }

    /* Hover Effect - links glow when mouse moves over them */
    a {
      color: #369cef;
      text-decoration: none;
      font-size: 15px;
      margin: 0 12px;
      padding: 8px 18px;
      border: 2px solid #e65c00;
      border-radius: 8px;
    }

    a:hover {
      background: #e65c00;
      color: white;
    }
        </style>

    </head>
    <body>

        <h1>My Food Menu</h1>
        <p>Pick your favorite dish and dig in</p>

        <ul>
            <li>pizza</li>
            <li>burger</li>
            <li>tacos- chef special</li>
            <li>noodles</li>
            <li>icecream</li>
        </ul>

        <p class="desc">Every dish on this menu is made with love and laods of flavor. Try them all and find your favorite. </p>

        <div class="link">
            <a href="#">Order now</a>
            <a href="#">See more</a>
        </div>
    </body>
</html>
