<!DOCTYPE html>
<html>
    <body>

        <h2>Javascript Arrays in Methods</h2>
        <h2>join() and pop()</h2>
        <p>The join() method joins arrays elements into a string and, the pop() removes the last element from an array.</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruits = ["Banana", "Mangao", "Apple", "Pear" ];
            document.getElementById("myjoin").innerHTML = fruits.join("*");
            document.getElementById("myfirstpop").innerHTML = fruits;
            fruits.pop();
            document.getElementById("mysecondpop").innerHTML = fruits;
        </script>

    </body>
</html>
