<!DOCTYPE html>
<html>
    <head>
        <title>My Hobby Card</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{
                background-color: rgb(27, 141, 141);
                font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', ;
                padding: 30px 15px;
            }

            h1{
                text-align: center;
                color: rgb(51, 222, 165);
            }

            .hobby-card{
                text-align: center;
                border: 2px solid rgb(7, 46, 41);
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                background-color: rgb(116, 243, 243);
            }

            .hobby-card h3{
                color: rgb(6, 61, 43);
                font-weight: bold;
            }
        </style>
    </head>
    <body>
<h2>My Hobby Cards</h2>
<div class="container">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
        <div class="hobby-card">
        <h3>Drawing</h3>
        <p>I love drawing anime and comic characters.</p>
        </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Football</h3>
                <p>I play every evening with my friends.</p>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Reading</h3>
                <p>My favorite books are fantasy.</p>
            </div>
        </div>
    </div>
</div>

        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

        </script>
    </body>
</html>
