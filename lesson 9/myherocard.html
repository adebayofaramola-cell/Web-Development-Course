<!DOCTYPE html>
<html>
    <head>
        <title>My Superhero Card</title>
        <style>

            body{
                background-color: salmon;
                color: rgb(191, 226, 192);
                font-family: Georgia, 'Times New Roman', Times, serif;
            }

            .hero-name{
                font-size: 60px;
                font-weight: bold;
                color: rgb(200, 205, 231);
                text-shadow: 3px 3px rgb(60, 109, 201);
            }

        .tagline{
            font-style: italic;
            color: rgb(69, 130, 186);
            text-transform: capitalize;
        }

        .label{
            text-transform: capitalize;
            text-decoration: underline;
            color: #63aebf;
        }

        .power{
            font-weight: bold;
            color: antiquewhite;
        }

        .weakness{
           text-decoration:         line-through;
            color: grey;
        }

        .badge {
      font-size: 28px;
      font-weight: bold;
      color: gold;
      transform: rotate(15deg);
    }

    .made-by {
      color: rgb(111, 42, 17);
      font-style: italic;
    }
        </style>

    </head>
    <body>
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">the most powerful hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">can run faster than a cheetah</p>
        <P class="power">can lift up aschool bus</P>

        <h2 class="label">weakness</h2>
        <p class="weakness">maths homework</p>
        <P class="weakness">broccoli</P>

        <p class="bagde">Top hero</p>

        <p class="made-by">Created by Faramola</p>

    </body>
</html>
